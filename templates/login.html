<!doctype html>
<html lang="en" data-bs-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ app_name }} - Sign in</title>
  <link rel="shortcut icon" href="{{ url_for('static', filename='img/favicon.svg') }}" type="image/x-icon">
  <link rel="stylesheet" href="{{ url_for('static', filename='mazer/assets/compiled/css/app.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='mazer/assets/compiled/css/auth.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='mazer/assets/compiled/css/iconly.css') }}">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <style>
    body {
      overflow: hidden;
    }
    #auth {
      min-height: 100vh;
    }
    #auth-left {
      padding: 5rem;
      background: #f5f8ff;
      min-height: 100vh;
    }
    #auth-right {
      min-height: 100vh;
      background:
        url("{{ url_for('static', filename='mazer/assets/compiled/svg/bg.svg') }}") center/cover,
        linear-gradient(90deg, #2d499d, #3f5491);
    }
    .auth-logo img {
      height: 2rem;
    }
    .auth-title {
      font-size: 4rem;
      line-height: 1.05;
      margin-top: 6rem;
      margin-bottom: 1.5rem;
    }
    .auth-subtitle {
      font-size: 1.7rem;
      line-height: 2.5rem;
      color: #a8aebb;
      max-width: 28rem;
      margin-bottom: 4.5rem;
    }
    @media screen and (max-width: 1399.9px) {
      #auth-left {
        padding: 3rem;
      }
      .auth-title {
        margin-top: 3rem;
      }
    }
    @media screen and (max-width: 767px) {
      body {
        overflow: auto;
      }
      #auth-left {
        min-height: auto;
        padding: 3rem 2rem 4rem;
      }
      .auth-title {
        font-size: 3rem;
      }
      .auth-subtitle {
        font-size: 1.25rem;
        line-height: 2rem;
      }
    }
  </style>
</head>
<body>
  <script src="{{ url_for('static', filename='mazer/assets/static/js/initTheme.js') }}"></script>
  <div id="auth">
    <div class="row h-100 g-0">
      <div class="col-lg-4 col-12">
        <div id="auth-left" class="d-flex flex-column justify-content-center">
          <div class="auth-logo">
            <a href="{{ url_for('login') }}" class="d-inline-flex align-items-center gap-3 text-decoration-none">
              <img src="{{ url_for('static', filename='img/logo.svg') }}" alt="{{ app_name }}">
              <span class="fw-semibold fs-2 text-primary">{{ app_name }}</span>
            </a>
          </div>

          <h1 class="auth-title text-primary">Log in.</h1>
          <p class="auth-subtitle">Log in with your data that you entered during registration.</p>

          {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
              {% for category, message in messages %}
                <div class="alert alert-{{ category }}" role="alert">{{ message }}</div>
              {% endfor %}
            {% endif %}
          {% endwith %}

          <form method="post" class="d-grid gap-3">
            <div class="form-group position-relative has-icon-left mb-1">
              <input type="text" class="form-control form-control-xl" name="identifier" placeholder="Username" autocomplete="username" required>
              <div class="form-control-icon">
                <i class="bi bi-person"></i>
              </div>
            </div>
            <div class="form-group position-relative has-icon-left mb-1">
              <input type="password" class="form-control form-control-xl" name="password" placeholder="Password" autocomplete="current-password" required>
              <div class="form-control-icon">
                <i class="bi bi-shield-lock"></i>
              </div>
            </div>
            <div class="form-check form-check-lg d-flex align-items-center gap-2 mt-2">
              <input class="form-check-input" type="checkbox" id="keepLoggedIn">
              <label class="form-check-label text-muted" for="keepLoggedIn">Keep me logged in</label>
            </div>
            <button class="btn btn-primary btn-lg shadow-lg mt-4">Log in</button>
          </form>
        </div>
      </div>
      <div class="col-lg-8 d-none d-lg-block">
        <div id="auth-right"></div>
      </div>
    </div>
  </div>
  <script src="{{ url_for('static', filename='mazer/assets/static/js/components/dark.js') }}"></script>
  <script src="{{ url_for('static', filename='mazer/assets/compiled/js/app.js') }}"></script>
</body>
</html>
