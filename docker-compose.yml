services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: erp
      POSTGRES_USER: erpuser
      POSTGRES_PASSWORD: erppass
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U erpuser -d erp"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build: .
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "0.0.0.0:8000:8000"
    environment:
      FLASK_CONFIG: development
      DATABASE_URL: postgresql://erpuser:erppass@db:5432/erp
      SECRET_KEY: change-me-in-docker
      AUTO_CREATE_DB: "true"
      ENABLE_SCHEDULER: "false"
    volumes:
      - .:/app
    entrypoint: ["sh", "/app/entrypoint.sh"]

volumes:
  postgres_data:
